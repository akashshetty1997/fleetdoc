[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetdoc"
version = "0.1.0"
description = "Synthetic GPU fleet incident diagnosis agent with MCP tools"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "openai>=1.68.0,<3.0.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
fleetdoc = "fleetdoc.cli:main"
fleetdoc-mcp = "fleetdoc.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires OPENAI_API_KEY and makes network calls"]
